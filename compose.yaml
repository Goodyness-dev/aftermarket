services:
  aftermarket:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      HOST: 0.0.0.0
      NEAR_LIVE_DEMO: "0"
    volumes:
      - aftermarket-data:/app/data
    restart: unless-stopped
volumes:
  aftermarket-data:
