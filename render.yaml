# Free cloud practice demo. No custodial signing keys are deployed.
# Saves on this plan are ephemeral: see docs/HOSTING.md.
services:
  - type: web
    name: aftermarket
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /tmp/aftermarket
      - key: NEAR_LIVE_DEMO
        value: "0"
